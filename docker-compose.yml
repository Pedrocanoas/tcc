services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      CORS_ORIGIN: https://${DOMAIN:-localhost}
    volumes:
      - ./model/checkpoints:/app/model/checkpoints:ro
    expose:
      - "3000"

  caddy:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      CADDY_ADDRESS: ${CADDY_ADDRESS:-https://${DOMAIN:-localhost}}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
